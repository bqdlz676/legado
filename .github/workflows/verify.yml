name: Verify (unit tests)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      baseline_full_test:
        description: 'baseline 模式：单 job 跑全量单测对照（默认 false 走 4 分片并行）'
        type: boolean
        default: false

permissions:
  contents: read

# 同一 ref 上后推的 commit 自动取消旧 run：避免 4~5 个 run 同时抢 runner，压一轮红灯的等待与额度成本。
# 取值取舍：cancel-in-progress: true 取"红反馈快"——旧 run 排队/在跑即取消，最新一轮红最先出、runner 不堆积；
# 代价是会打断在飞验证（K-20 实证 push 会 cancelled 在飞 run）。验证车道只跑测试，红反馈优先，保留 true。
# cancel-in-progress 只取消旧 run，不跳过测试、不削弱汇总断言。
concurrency:
  group: verify-${{ github.ref }}
  # 为什么改 false：连推时 cancel-in-progress 会把上一轮正在跑的 shard 连同失败 XML 一起掐掉，
  # 等于"每个新提交都销毁前一轮证据"（2026-11-26 实测 f590b58/a10e0b3 两轮 Verify 全 cancelled，零结论）。
  # 改为排队：新 run 等到旧 run 结束再跑，证据链完整；代价是最多等一轮，可接受。
  cancel-in-progress: false

# 口径与护栏（改动前先读）：
# - 基线测试数 3185 的权威来源：docs/台账-CI转绿登记.md 与 docs/复盘-CI连红到全绿-根因清单.md
#   （success run 45404217394 / commit a978f15，3185 tests 0 failed）。
# - 汇总 job 硬断言：各分片 JUnit XML 的 tests= 求和不得低于 3185；少于即 FAIL 并打印差值（防分片漏测的唯一保险）。
# - 全程不使用 continue-on-error、不用 if: always() 掩盖失败；测试类不静默删减——
#   Q-246 起 Rhino 阻塞求值类从 4 分片排除，平移到独立 rhino-eval-tests job 执行，断言总数不变；
#   任一 shard / rhino job 失败都会阻断汇总。
# - 缓存未命中时 actions/cache 自动跳过 restore，Gradle 正常走网络下载；任何位置都不加 --offline。
# - 本文件由原 build.yml 验证侧 job 逐字搬运；出包 job 见 package.yml。

jobs:
  # ---------- 路径分流：先判本轮改动落在哪条车道（docs-only / scripts-only / code），纯 git diff，不装 JDK/Gradle ----------
  # 为什么先分类再跑构建：纯文档 / 纯门禁脚本提交对 APK 与截图零影响，不再拉起 Android 构建链；
  # 判据保守——白名单之外的一切路径默认按码变处理，宁多跑不可少跑（见 docs/修复-CI路径分流提速.md）。
  classify-paths:
    name: Classify changed paths (lane)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
      lane: ${{ steps.classify.outputs.lane }}
      changed_files: ${{ steps.classify.outputs.changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files into lane
        id: classify
        run: |
          python3 - <<'PY'
          import os, subprocess

          def git(*args):
              # quotepath=false：非 ASCII 路径（中文文件名）不被加引号转义，
              # 否则前缀匹配（app/、data_scripts/ 等）会被引号挡掉，码变路径可能误判 docs-only。
              r = subprocess.run(['git', '-c', 'core.quotepath=false', *args],
                                 capture_output=True, text=True)
              return r.returncode, r.stdout.strip()

          event = '${{ github.event_name }}'
          before = '${{ github.event.before }}'
          files = []

          if event == 'workflow_dispatch':
              # 手动触发保守按码变全量跑：手动车道多用于基线对照/补跑，不享受分流跳过。
              files = []
          elif event == 'pull_request':
              base_sha = '${{ github.event.pull_request.base.sha }}'
              rc, mb = git('merge-base', base_sha, 'HEAD')
              base = mb if rc == 0 and mb else base_sha
              rc, out = git('diff', '--name-only', base, 'HEAD')
              files = [f for f in out.splitlines() if f]
          else:
              if not before or set(before) == {'0'}:
                  rc, parent = git('rev-parse', 'HEAD~1')
                  base = parent if rc == 0 and parent else ''
              else:
                  base = before
              if base:
                  rc, out = git('diff', '--name-only', base, 'HEAD')
                  files = [f for f in out.splitlines() if f]

          # 码变白名单（命中任一即必须跑完整构建链）：应用/模块/截图/三方源码、Gradle 构建面、
          # CI 配置与 composite action、版本号、以及两个被 workflow 直接调用的数据脚本。
          CODE_PREFIXES = ('app/', 'modules/', 'screenshot/', 'third_party/',
                           'gradle/', 'buildSrc/', '.github/')
          CODE_EXACT = {'build.gradle', 'settings.gradle', 'settings.gradle.kts',
                        'gradle.properties', 'gradlew', 'gradlew.bat',
                        '.versioncode', 'package.json'}
          CI_INVOKED_SCRIPTS = {'data_scripts/emit-shard-lists.py',
                                'data_scripts/frame-manifest.py'}

          def is_code(p):
              if p in CODE_EXACT or p in CI_INVOKED_SCRIPTS:
                  return True
              if p.endswith('.gradle') or p.endswith('.gradle.kts'):
                  return True
              return any(p.startswith(pre) for pre in CODE_PREFIXES)

          def is_safe(p):
              # 可跳过 Android 构建的非码变域：docs/、data_scripts/、任意层级 *.md。
              # 注意优先级：先判码变白名单，落在 app/ 等目录下的 *.md 仍按码变处理。
              return p.startswith('docs/') or p.startswith('data_scripts/') or p.endswith('.md')

          code_changed = any(is_code(p) for p in files)
          if not files:
              # 空集保守按码变：取不到 diff（首推/异常）时不允许跳过构建链。
              lane = 'code'
              code_changed = True
          elif code_changed:
              lane = 'code'
          elif any(p.startswith('data_scripts/') for p in files):
              lane = 'scripts-only'
          else:
              lane = 'docs-only'

          out_path = os.environ['GITHUB_OUTPUT']
          with open(out_path, 'a') as fh:
              fh.write('code_changed=%s\n' % ('true' if code_changed else 'false'))
              fh.write('lane=%s\n' % lane)
              fh.write('changed_files<<EOF\n')
              fh.write('\n'.join(files))
              fh.write('\nEOF\n')
          print('lane=%s code_changed=%s' % (lane, code_changed))
          print('changed_files=%s' % files)
          PY

  # ---------- 静态门禁：任何车道都跑（含 docs-only / scripts-only），只读检查，不装 JDK/Gradle ----------
  # 为什么必须常驻：分流只跳过 Android 构建/截图/打包，文档与门禁脚本本身的质量闸不能跟着跳过。
  # 空集（rc=2）按中性放行：本轮无待检报告不是"合规"，也不是红，同 ㊾ 口径；rc=1 才置红。
  static-gate:
    name: Static gate (read-only, always runs)
    needs: classify-paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile gate scripts (syntax only, no Gradle)
        run: python3 -m py_compile data_scripts/*.py

      - name: Report fields gate (EMPTY rc=2 neutral)
        run: |
          set +e
          python3 data_scripts/check-report-fields.py; rc=$?
          if [ "$rc" -eq 2 ]; then echo "::notice::report-fields EMPTY 空集，中性放行"; else exit "$rc"; fi

      - name: Anchor card gate --strict (EMPTY rc=2 neutral)
        run: |
          set +e
          python3 data_scripts/check-anchor-card.py --strict; rc=$?
          if [ "$rc" -eq 2 ]; then echo "::notice::anchor-card EMPTY 空集，中性放行"; else exit "$rc"; fi

      - name: Problem finding gate
        run: python3 data_scripts/check-problem-finding.py

      - name: Onboarding receipt gate
        run: python3 data_scripts/check-onboarding.py

      - name: Pyramid catalog contract gate
        run: |
          python3 data_scripts/astro_check_pyramid.py
          python3 data_scripts/astro_check_pyramid.py --selftest

  # ---------- 分片 0：编译测试源码，枚举测试类并切成 4 份确定性清单 ----------
  discover:
    name: Discover test classes (shard lists)
    needs: classify-paths
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.baseline_full_test != true) && needs.classify-paths.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 不用 actions/setup-java：4 个分片并发下载同一份 temurin 包时，Adoptium 下载接口会限流，
      # 实测 verify #1/#2 都是"discover（先跑、单路下载）绿、4 个分片全部红在 Set up JDK 这一步"。
      # runner 镜像本身预装 Temurin 21（JAVA_HOME_21_X64），本地可取、零网络；
      # 仅镜像缺 21 时才回落下拉，三次重试仍失败才红——红灯因此只会来自真实缺 JDK，而不是并发限流。
      - name: Set up JDK 21 (preinstalled, no network)
        run: |
          set -euo pipefail
          for H in "${JAVA_HOME_21_X64:-}" "${JAVA_HOME_21_ARM64:-}"; do
            if [ -n "$H" ] && [ -x "$H/bin/java" ]; then
              echo "JAVA_HOME=$H" >> "$GITHUB_ENV"
              echo "$H/bin" >> "$GITHUB_PATH"
              "$H/bin/java" -version 2>&1 | head -3
              echo "using preinstalled JDK21 at $H"
              exit 0
            fi
          done
          echo "::warning::runner 未预装 JDK21，回落下拉 temurin"
          for i in 1 2 3; do
            if curl -fsSL -o /tmp/jdk21.tar.gz \
              "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse"; then
              mkdir -p /opt/jdk21
              tar -xzf /tmp/jdk21.tar.gz -C /opt/jdk21 --strip-components=1
              echo "JAVA_HOME=/opt/jdk21" >> "$GITHUB_ENV"
              echo "/opt/jdk21/bin" >> "$GITHUB_PATH"
              /opt/jdk21/bin/java -version 2>&1 | head -3
              exit 0
            fi
            echo "::warning::jdk download attempt $i failed"; sleep 15
          done
          echo "::error::JDK21 三条路径都不可用（预装缺失 + 下载三次失败）"; exit 1

      - name: Install SDK components (skip when image preinstalled)
        run: |
          set -e
          # 快路径：镜像已带 platform 36 + build-tools 36.0.0 就直接跳过（每 job 省 30~60s，
          # 6 个 job 合计一轮省 3~6 分钟）。组件缺失才走原 retry 安装，安装语义一字未改。
          if [ -d "${ANDROID_HOME}/platforms/android-36" ] && [ -d "${ANDROID_HOME}/build-tools/36.0.0" ]; then
            echo "SDK 组件已预装，跳过 sdkmanager"; exit 0
          fi
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # Google 对同一 IP 的并发 sdkmanager 有 429 限流：4 个分片同时装同一套组件时
          # 偶发只成功 1 个、其余失败，会被误读成代码回归。故重试 3 次（间隔 20s），
          # 三次全失败才让 job 红，红灯含义仍是"组件装不上"而不是"测试没通过"。
          for i in 1 2 3; do
            if "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"; then
              echo "sdk components ok (attempt $i)"; exit 0
            fi
            echo "::warning::sdkmanager attempt $i failed, retry in 20s"; sleep 20
          done
          echo "::error::sdkmanager failed 3 times"; exit 1

      # 缓存 key 第一部分：wrapper distributionUrl 指纹（换 Gradle 版本必然换 key）
      - name: Compute cache key inputs
        id: cachekey
        run: |
          set -e
          DIST="$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | tr -d '\\')"
          echo "distributionUrl=$DIST"
          echo "dist-hash=$(printf '%s' "$DIST" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache Gradle wrapper and modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # key = distributionUrl 指纹 + 全部 build.gradle* / 版本目录 / wrapper 配置 hash；
          # restore-keys 先同 Gradle 版本前缀回退，再裸前缀回退，保证依赖变更后可部分复用。
          key: gradle-${{ steps.cachekey.outputs.dist-hash }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ steps.cachekey.outputs.dist-hash }}-
            gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # versionCode 的唯一权威是仓库根 .versioncode；低于硬地板 38000 直接 fail。
      - name: Resolve versionCode (.versioncode single source)
        run: |
          VC="$(tr -d '[:space:]' < .versioncode)"
          echo "versionCode=$VC" | tee -a "$GITHUB_STEP_SUMMARY"
          if ! [[ "$VC" =~ ^[0-9]+$ ]] || (( VC < 38000 )); then
            echo "::error::.versioncode 非法或低于硬地板 38000: '$VC'"; exit 1
          fi

      - name: Compile unit test sources
        run: |
          set -uo pipefail
          # 保留完整日志用于失败诊断：管道 tee 让日志落盘，PIPESTATUS 取 gradle 真实退出码。
          ./gradlew :app:compileAppDebugUnitTestKotlin :app:compileAppDebugUnitTestJavaWithJavac --no-daemon --build-cache --stacktrace 2>&1 | tee gradle-discover.log
          exit "${PIPESTATUS[0]}"

      - name: Dump discover failure diagnostics
        if: failure()
        run: |
          {
            echo "### discover 失败诊断"
            echo "- gradle 版本: $(./gradlew --version 2>&1 | grep -m1 Gradle || echo NA)"
            echo '```text'
            grep -E 'FAILURE|error:|Exception|Could not|AAPT|Cannot' gradle-discover.log 2>/dev/null | head -40 || true
            echo '--- tail 40 ---'
            tail -40 gradle-discover.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 枚举编译产物 → 按磁盘源码逐条净化 → 排序 round-robin 切 4 份；
      # 并集必须 == 净化后全集、两两不得重叠（脚本内断言，"分片并集=全集"第一道机制保证）。
      # 净化在分片之前做：bench 引擎 object / 报告 data class / 分类标记 interface / 文件 facade /
      # 无 @Test 辅助类不进 --tests 清单；@Category 打标类归 rhino/slow-bench 独立 job。
      # 逻辑落在 data_scripts/emit-shard-lists.py：可回放既有 artifact 清单、可 --selftest 双向夹具。
      - name: Enumerate, purify compiled test classes and split into 4 shards
        run: python3 data_scripts/emit-shard-lists.py --from-build --out-dir .

      - name: Upload test class lists
        uses: actions/upload-artifact@v4
        with:
          name: test-class-lists
          path: |
            shard-*.txt
            manifest.json
          if-no-files-found: error

  # ---------- 4 个分片并行跑单测；fail-fast=false 保证任一失败时其余分片仍跑完留证 ----------
  test-shard:
    name: Unit tests shard ${{ matrix.shard }}/4
    # 车道闸：仅码变车道拉起；docs-only / scripts-only 连 checkout/JDK/Gradle 都不进（needs 不挂本 job）。
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.baseline_full_test != true) && needs.classify-paths.outputs.code_changed == 'true' }}
    needs: [classify-paths, discover]
    runs-on: ubuntu-latest
    # 超时 15 分钟：绿跑实测单片 ~5 分钟（268~320s），45 分钟只让"静默挂死"白等 40 分钟且拿不到证据；
    # 收到 15 分钟后 job 取消 → 可直接下载 job 日志，用 testLogging 的 STARTED 行定位最后用例（Q-261 起有此日志）。
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 不用 actions/setup-java：4 个分片并发下载同一份 temurin 包时，Adoptium 下载接口会限流，
      # 实测 verify #1/#2 都是"discover（先跑、单路下载）绿、4 个分片全部红在 Set up JDK 这一步"。
      # runner 镜像本身预装 Temurin 21（JAVA_HOME_21_X64），本地可取、零网络；
      # 仅镜像缺 21 时才回落下拉，三次重试仍失败才红——红灯因此只会来自真实缺 JDK，而不是并发限流。
      - name: Set up JDK 21 (preinstalled, no network)
        run: |
          set -euo pipefail
          for H in "${JAVA_HOME_21_X64:-}" "${JAVA_HOME_21_ARM64:-}"; do
            if [ -n "$H" ] && [ -x "$H/bin/java" ]; then
              echo "JAVA_HOME=$H" >> "$GITHUB_ENV"
              echo "$H/bin" >> "$GITHUB_PATH"
              "$H/bin/java" -version 2>&1 | head -3
              echo "using preinstalled JDK21 at $H"
              exit 0
            fi
          done
          echo "::warning::runner 未预装 JDK21，回落下拉 temurin"
          for i in 1 2 3; do
            if curl -fsSL -o /tmp/jdk21.tar.gz \
              "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse"; then
              mkdir -p /opt/jdk21
              tar -xzf /tmp/jdk21.tar.gz -C /opt/jdk21 --strip-components=1
              echo "JAVA_HOME=/opt/jdk21" >> "$GITHUB_ENV"
              echo "/opt/jdk21/bin" >> "$GITHUB_PATH"
              /opt/jdk21/bin/java -version 2>&1 | head -3
              exit 0
            fi
            echo "::warning::jdk download attempt $i failed"; sleep 15
          done
          echo "::error::JDK21 三条路径都不可用（预装缺失 + 下载三次失败）"; exit 1

      - name: Install SDK components (skip when image preinstalled)
        run: |
          set -e
          # 快路径：镜像已带 platform 36 + build-tools 36.0.0 就直接跳过（每 job 省 30~60s，
          # 6 个 job 合计一轮省 3~6 分钟）。组件缺失才走原 retry 安装，安装语义一字未改。
          if [ -d "${ANDROID_HOME}/platforms/android-36" ] && [ -d "${ANDROID_HOME}/build-tools/36.0.0" ]; then
            echo "SDK 组件已预装，跳过 sdkmanager"; exit 0
          fi
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # Google 对同一 IP 的并发 sdkmanager 有 429 限流：4 个分片同时装同一套组件时
          # 偶发只成功 1 个、其余失败，会被误读成代码回归。故重试 3 次（间隔 20s），
          # 三次全失败才让 job 红，红灯含义仍是"组件装不上"而不是"测试没通过"。
          for i in 1 2 3; do
            if "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"; then
              echo "sdk components ok (attempt $i)"; exit 0
            fi
            echo "::warning::sdkmanager attempt $i failed, retry in 20s"; sleep 20
          done
          echo "::error::sdkmanager failed 3 times"; exit 1

      - name: Compute cache key inputs
        id: cachekey
        run: |
          set -e
          DIST="$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | tr -d '\\')"
          echo "dist-hash=$(printf '%s' "$DIST" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache Gradle wrapper and modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ steps.cachekey.outputs.dist-hash }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ steps.cachekey.outputs.dist-hash }}-
            gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Download class lists
        uses: actions/download-artifact@v4
        with:
          name: test-class-lists
          path: class-lists

      # 只跑本分片清单内的类；--tests 是包含式过滤；-PexcludeRhino 排除 Rhino 阻塞求值分类（Q-246），
      # -PexcludeSlowBench 排除重负载模型层 bench 分类（Q-261）；两类分别由独立
      # rhino-eval-tests / slow-bench-tests job 执行，不在分片内求值，避免阻塞线程或大批量
      # 迭代拖死 test worker。分片排除集与两个独立 job 包含集互斥，三者并集 == discover 全量清单。
      - name: Run shard unit tests and benches
        run: |
          set -uo pipefail
          mapfile -t CLASSES < "class-lists/shard-${{ matrix.shard }}.txt"
          if [ ${#CLASSES[@]} -eq 0 ]; then
            echo "::error::分片 ${{ matrix.shard }} 清单为空，拒绝空跑"; exit 1
          fi
          ARGS=()
          for c in "${CLASSES[@]}"; do ARGS+=(--tests "$c"); done
          echo "shard ${{ matrix.shard }}/4: ${#CLASSES[@]} classes"
          # 不用 set -e：tee 之后要按 PIPESTATUS[0] 取 gradle 的真实退出码，
          # 否则失败信息会被管道吞掉、红因只剩一个空退出码。
          ./gradlew :app:testAppDebugUnitTest -PexcludeRhino -PexcludeSlowBench --no-daemon --build-cache --stacktrace "${ARGS[@]}" 2>&1 | tee "gradle-shard-${{ matrix.shard }}.log"
          exit "${PIPESTATUS[0]}"

      - name: Dump shard failure diagnostics
        if: failure()
        run: |
          LOG="gradle-shard-${{ matrix.shard }}.log"
          {
            echo "### 分片 ${{ matrix.shard }}/4 失败诊断"
            echo "- 清单行数: $(wc -l < "class-lists/shard-${{ matrix.shard }}.txt" 2>/dev/null || echo NA)"
            echo "- 测试 XML 数: $(ls app/build/test-results/testAppDebugUnitTest/*.xml 2>/dev/null | wc -l)"
            echo "- 清单头 3 类: $(head -3 "class-lists/shard-${{ matrix.shard }}.txt" 2>/dev/null | tr '\n' ' ')"
            echo '```text'
            grep -E 'FAILED|error:|Exception|No tests found|Could not|FAILURE|BUILD' "$LOG" 2>/dev/null | head -40 || true
            echo '--- tail 40 ---'
            tail -40 "$LOG" 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # summary 只有登录用户能看；这里再把失败用例名打成 annotation，
          # 未登录也能读到（annotation 每 job 上限 10 条，故合并成 1 条、截断到 900 字符）。
          # Gradle 的失败行形如 "com.x.MyTest > 方法名 FAILED"，统一按行尾 FAILED 抓取。
          FAILED_CASES="$(grep -E 'FAILED$' "$LOG" 2>/dev/null | sed 's/^ *//' | head -12 | tr '\n' ';')"
          if [ -n "$FAILED_CASES" ]; then
            echo "::error::shard ${{ matrix.shard }}/4 失败用例: ${FAILED_CASES:0:900}"
          else
            echo "::error::shard ${{ matrix.shard }}/4 无匹配失败用例行,尾部: $(tail -6 "$LOG" 2>/dev/null | tr '\n' ';' | cut -c1-700)"
          fi

      # 绿跑 XML：供 test-aggregate 下载求和（pattern: test-results-shard-*），
      # 故本步骤保持默认 success() 条件——aggregate 只在全绿时运行，失败分片的 XML 由下面失败专用步骤兜底。
      # 路径放宽为递归 **：Gradle 报告可能落在变体子目录，非递归 *.xml 会漏传（run 45783964800 shard-1 取证缺口即此机制之一）。
      - name: Upload shard JUnit XML results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: app/build/test-results/**/*.xml
          if-no-files-found: warn

      # 失败专用取证：测试步骤一旦失败，默认 success() 条件的上传步骤会被跳过，
      # 导致失败分片的 JUnit XML（含 <failure> 的 expected/actual 与堆栈）不出现在产物列表。
      # 本步骤显式 if: failure() 兜底，artifact 名带 -failed 后缀，仍含 shard 号；
      # aggregate 仅在全绿时运行，不会与本产物 pattern 撞车。
      - name: Upload failed-shard JUnit XML (failure-only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}-failed
          path: app/build/test-results/**/*.xml
          if-no-files-found: warn

  # ---------- Rhino 阻塞求值分类独立 job（Q-246）：只跑 @Category(RhinoEvalTest)，8 分钟超时。
  # 背景：Rhino eval/compile 同步阻塞且忽略 interrupt，JUnit @Test(timeout) 只能判失败不能杀线程；
  # 这类测试混进分片会把 test worker 拖死（shard 2 挂死 30 分钟以上）。隔离后挂死只红本 job，不拖累 4 分片。
  rhino-eval-tests:
    name: Rhino eval tests (isolated)
    # 车道闸：仅码变车道拉起；非码变车道不进 checkout/JDK/Gradle。
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.baseline_full_test != true) && needs.classify-paths.outputs.code_changed == 'true' }}
    needs: [classify-paths]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 与分片相同的预装 JDK21 取值路径，避免并发下载 Adoptium 限流（说明见 test-shard 同名步骤）。
      - name: Set up JDK 21 (preinstalled, no network)
        run: |
          set -euo pipefail
          for H in "${JAVA_HOME_21_X64:-}" "${JAVA_HOME_21_ARM64:-}"; do
            if [ -n "$H" ] && [ -x "$H/bin/java" ]; then
              echo "JAVA_HOME=$H" >> "$GITHUB_ENV"
              echo "$H/bin" >> "$GITHUB_PATH"
              "$H/bin/java" -version 2>&1 | head -3
              echo "using preinstalled JDK21 at $H"
              exit 0
            fi
          done
          echo "::warning::runner 未预装 JDK21，回落下拉 temurin"
          for i in 1 2 3; do
            if curl -fsSL -o /tmp/jdk21.tar.gz \
              "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse"; then
              mkdir -p /opt/jdk21
              tar -xzf /tmp/jdk21.tar.gz -C /opt/jdk21 --strip-components=1
              echo "JAVA_HOME=/opt/jdk21" >> "$GITHUB_ENV"
              echo "/opt/jdk21/bin" >> "$GITHUB_PATH"
              /opt/jdk21/bin/java -version 2>&1 | head -3
              exit 0
            fi
            echo "::warning::jdk download attempt $i failed"; sleep 15
          done
          echo "::error::JDK21 三条路径都不可用（预装缺失 + 下载三次失败）"; exit 1

      - name: Install SDK components (skip when image preinstalled)
        run: |
          set -e
          if [ -d "${ANDROID_HOME}/platforms/android-36" ] && [ -d "${ANDROID_HOME}/build-tools/36.0.0" ]; then
            echo "SDK 组件已预装，跳过 sdkmanager"; exit 0
          fi
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          for i in 1 2 3; do
            if "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"; then
              echo "sdk components ok (attempt $i)"; exit 0
            fi
            echo "::warning::sdkmanager attempt $i failed, retry in 20s"; sleep 20
          done
          echo "::error::sdkmanager failed 3 times"; exit 1

      - name: Compute cache key inputs
        id: cachekey
        run: |
          set -e
          DIST="$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | tr -d '\\')"
          echo "dist-hash=$(printf '%s' "$DIST" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache Gradle wrapper and modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ steps.cachekey.outputs.dist-hash }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ steps.cachekey.outputs.dist-hash }}-
            gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # -PincludeRhino 只纳入 RhinoEvalTest 分类；不带 --tests，由 Gradle 分类过滤器选取，
      # 与分片的 -PexcludeRhino 互斥，互不交叉执行（aggregate 的跨 job 重复执行判定据此不报错）。
      - name: Run Rhino category tests
        run: |
          set -uo pipefail
          ./gradlew :app:testAppDebugUnitTest -PincludeRhino --no-daemon --build-cache --stacktrace 2>&1 | tee gradle-rhino.log
          exit "${PIPESTATUS[0]}"

      - name: Dump Rhino failure diagnostics
        if: failure()
        run: |
          {
            echo "### rhino-eval-tests 失败诊断"
            echo "- 测试 XML 数: $(ls app/build/test-results/testAppDebugUnitTest/*.xml 2>/dev/null | wc -l)"
            echo '```text'
            grep -E 'FAILED|error:|Exception|No tests found|Could not|FAILURE|BUILD' gradle-rhino.log 2>/dev/null | head -40 || true
            echo '--- tail 40 ---'
            tail -40 gradle-rhino.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          FAILED_CASES="$(grep -E 'FAILED$' gradle-rhino.log 2>/dev/null | sed 's/^ *//' | head -12 | tr '\n' ';')"
          if [ -n "$FAILED_CASES" ]; then
            echo "::error::rhino-eval-tests 失败用例: ${FAILED_CASES:0:900}"
          else
            echo "::error::rhino-eval-tests 无匹配失败用例行,尾部: $(tail -6 gradle-rhino.log 2>/dev/null | tr '\n' ';' | cut -c1-700)"
          fi

      # 绿跑 XML 供 test-aggregate 下载求和（pattern: test-results-rhino-*）。
      - name: Upload Rhino JUnit XML results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-rhino-eval
          path: app/build/test-results/**/*.xml
          if-no-files-found: warn

      - name: Upload failed-Rhino JUnit XML (failure-only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-rhino-eval-failed
          path: app/build/test-results/**/*.xml
          if-no-files-found: warn

  # ---------- 重负载 bench 分类独立 job（Q-261）：只跑 @Category(SlowBenchTest)，8 分钟超时。
  # 背景：这批模型层 bench 跑 warmup 数千 + 测量数万轮 / A* 寻路 / 整局推演，单类占用 worker
  # 时间显著长于普通单测；混进分片会把某一片拖到超时且无 XML（shard 1 挂死 20 分钟以上即此路径）。
  # 与 Rhino 同族：不靠 @Test(timeout)（杀不掉已进入大批量循环的线程），分类隔离后慢速只红本 job。
  slow-bench-tests:
    name: Slow bench tests (isolated)
    # 车道闸：仅码变车道拉起；非码变车道不进 checkout/JDK/Gradle。
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.baseline_full_test != true) && needs.classify-paths.outputs.code_changed == 'true' }}
    needs: [classify-paths]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 与分片相同的预装 JDK21 取值路径，避免并发下载 Adoptium 限流（说明见 test-shard 同名步骤）。
      - name: Set up JDK 21 (preinstalled, no network)
        run: |
          set -euo pipefail
          for H in "${JAVA_HOME_21_X64:-}" "${JAVA_HOME_21_ARM64:-}"; do
            if [ -n "$H" ] && [ -x "$H/bin/java" ]; then
              echo "JAVA_HOME=$H" >> "$GITHUB_ENV"
              echo "$H/bin" >> "$GITHUB_PATH"
              "$H/bin/java" -version 2>&1 | head -3
              echo "using preinstalled JDK21 at $H"
              exit 0
            fi
          done
          echo "::warning::runner 未预装 JDK21，回落下拉 temurin"
          for i in 1 2 3; do
            if curl -fsSL -o /tmp/jdk21.tar.gz \
              "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse"; then
              mkdir -p /opt/jdk21
              tar -xzf /tmp/jdk21.tar.gz -C /opt/jdk21 --strip-components=1
              echo "JAVA_HOME=/opt/jdk21" >> "$GITHUB_ENV"
              echo "/opt/jdk21/bin" >> "$GITHUB_PATH"
              /opt/jdk21/bin/java -version 2>&1 | head -3
              exit 0
            fi
            echo "::warning::jdk download attempt $i failed"; sleep 15
          done
          echo "::error::JDK21 三条路径都不可用（预装缺失 + 下载三次失败）"; exit 1

      - name: Install SDK components (skip when image preinstalled)
        run: |
          set -e
          if [ -d "${ANDROID_HOME}/platforms/android-36" ] && [ -d "${ANDROID_HOME}/build-tools/36.0.0" ]; then
            echo "SDK 组件已预装，跳过 sdkmanager"; exit 0
          fi
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          for i in 1 2 3; do
            if "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"; then
              echo "sdk components ok (attempt $i)"; exit 0
            fi
            echo "::warning::sdkmanager attempt $i failed, retry in 20s"; sleep 20
          done
          echo "::error::sdkmanager failed 3 times"; exit 1

      - name: Compute cache key inputs
        id: cachekey
        run: |
          set -e
          DIST="$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | tr -d '\\')"
          echo "dist-hash=$(printf '%s' "$DIST" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache Gradle wrapper and modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ steps.cachekey.outputs.dist-hash }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ steps.cachekey.outputs.dist-hash }}-
            gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # -PincludeSlowBench 只纳入 SlowBenchTest 分类；不带 --tests，由 Gradle 分类过滤器选取，
      # 与分片的 -PexcludeSlowBench 互斥，互不交叉执行（aggregate 的跨 job 重复执行判定据此不报错）。
      - name: Run slow bench category tests
        run: |
          set -uo pipefail
          ./gradlew :app:testAppDebugUnitTest -PincludeSlowBench --no-daemon --build-cache --stacktrace 2>&1 | tee gradle-slow-bench.log
          exit "${PIPESTATUS[0]}"

      - name: Dump slow-bench failure diagnostics
        if: failure()
        run: |
          {
            echo "### slow-bench-tests 失败诊断"
            echo "- 测试 XML 数: $(ls app/build/test-results/testAppDebugUnitTest/*.xml 2>/dev/null | wc -l)"
            echo '```text'
            grep -E 'FAILED|error:|Exception|No tests found|Could not|FAILURE|BUILD|STARTED' gradle-slow-bench.log 2>/dev/null | head -40 || true
            echo '--- tail 40 ---'
            tail -40 gradle-slow-bench.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          FAILED_CASES="$(grep -E 'FAILED$' gradle-slow-bench.log 2>/dev/null | sed 's/^ *//' | head -12 | tr '\n' ';')"
          if [ -n "$FAILED_CASES" ]; then
            echo "::error::slow-bench-tests 失败用例: ${FAILED_CASES:0:900}"
          else
            echo "::error::slow-bench-tests 无匹配失败用例行,尾部: $(tail -6 gradle-slow-bench.log 2>/dev/null | tr '\n' ';' | cut -c1-700)"
          fi

      # 绿跑 XML 供 test-aggregate 下载求和（pattern: test-results-slow-bench-*）。
      - name: Upload slow-bench JUnit XML results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-slow-bench
          path: app/build/test-results/**/*.xml
          if-no-files-found: warn

      - name: Upload failed-slow-bench JUnit XML (failure-only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-slow-bench-failed
          path: app/build/test-results/**/*.xml
          if-no-files-found: warn

  # ---------- 汇总：needs 全部分片、Rhino 与 slow-bench 独立 job，求和 XML tests= 并硬断言基线 ----------
  test-aggregate:
    name: Aggregate & assert test totals
    # 车道闸：仅码变车道执行基线总数硬断言；非码变车道本 job 跳过，结论由 lane-summary 给出。
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.baseline_full_test != true) && needs.classify-paths.outputs.code_changed == 'true' }}
    needs: [classify-paths, discover, test-shard, rhino-eval-tests, slow-bench-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download shard JUnit XML results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-shard-*
          path: results

      # Q-246：Rhino 独立 job 的 XML 一并下载求和；漏掉这份会让总条数较基线少掉 Rhino 分类的用例数。
      - name: Download Rhino eval JUnit XML results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-rhino-*
          path: results

      # Q-261：slow-bench 独立 job 的 XML 一并下载求和；漏掉这份会让总条数较基线少掉 bench 分类的用例数。
      - name: Download slow-bench JUnit XML results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-slow-bench-*
          path: results

      - name: Download class manifest
        uses: actions/download-artifact@v4
        with:
          name: test-class-lists
          path: class-lists

      - name: Sum JUnit XML tests and assert baseline
        run: |
          python3 - <<'PY' 2>&1 | tee aggregate.log
          import glob, os, re, sys, json
          import xml.etree.ElementTree as ET
          # 基线 3185：来源 docs/台账-CI转绿登记.md / docs/复盘-CI连红到全绿-根因清单.md，
          # success run 45404217394 (commit a978f15)，3185 tests 0 failed 0 skipped。
          BASELINE = 3185
          xmls = sorted(glob.glob('results/**/*.xml', recursive=True))
          if not xmls:
              sys.exit('::error::未找到任何分片 JUnit XML 报告')
          total = failures = errors = skipped = 0
          per_shard = {}
          owner = {}
          dup = []
          for x in xmls:
              m = re.search(r'shard-(\d+)', x)
              if m:
                  shard = m.group(1)
              elif 'rhino-eval' in x:
                  shard = 'rhino'
              elif 'slow-bench' in x:
                  shard = 'slowbench'
              else:
                  shard = '?'
              root = ET.parse(x).getroot()
              suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
              for s in suites:
                  t = int(s.get('tests', 0)); f = int(s.get('failures', 0))
                  e = int(s.get('errors', 0)); sk = int(s.get('skipped', 0))
                  total += t; failures += f; errors += e; skipped += sk
                  per_shard[shard] = per_shard.get(shard, 0) + t
                  for tc in s.findall('testcase'):
                      cn = tc.get('classname') or tc.get('class') or ''
                      if cn:
                          if cn in owner and owner[cn] != shard:
                              dup.append((cn, owner[cn], shard))
                          owner[cn] = shard
          print(f'基线(台账)={BASELINE}  执行总条数={total}  failures={failures}  errors={errors}  skipped={skipped}')
          print('各分片条数:', dict(sorted(per_shard.items())))
          print(f'去重后测试类数={len(owner)}，XML 报告数={len(xmls)}')
          if dup:
              for cn, a, b in dup[:20]:
                  print(f'::error::类 {cn} 同时出现在分片 {a} 与 {b}（重复执行）')
              sys.exit(1)
          # 交叉核对：报告里出现的每个测试类都必须来自 discover 清单（嵌套类按外层归属）
          manifest_path = 'class-lists/manifest.json'
          if os.path.exists(manifest_path):
              manifest = set(json.load(open(manifest_path))['classes'])
              unknown = []
              for cn in owner:
                norm = cn.replace('$', '.')
                if not any(norm == m or norm.startswith(m + '.') or cn.startswith(m + '$') for m in manifest):
                  unknown.append(cn)
              if unknown:
                  sys.exit(f'::error::报告中的类不在分片清单内: {sorted(unknown)[:10]}')
          if failures + errors > 0:
              sys.exit(f'::error::单测失败 failures={failures} errors={errors}，请查看对应分片日志')
          if skipped > 0:
              sys.exit(f'::error::skipped={skipped}（不允许跳过任何测试）')
          if total < BASELINE:
              sys.exit(f'::error::测试总条数 {total} < 基线 {BASELINE}，差值 {BASELINE - total}（疑似分片漏测）')
          if total > BASELINE:
              print(f'::notice::总数较基线新增 {total - BASELINE} 条（允许：新增测试需在台账登记）')
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a') as fh:
                  fh.write(f'- 测试总条数：{total}（基线 {BASELINE}）；failures={failures} errors={errors} skipped={skipped}\n')
                  fh.write(f'- 各分片条数：{dict(sorted(per_shard.items()))}\n')
          PY

  # ---------- 非码变车道汇总：docs-only / scripts-only 车道的明确 success 结论 ----------
  # 为什么独立成 job：needs 只挂恒存在的 classify-paths / static-gate，不依赖会被整链跳过的
  # Android 链下游；非码变车道下本 job 给出本车道的显式成功结论。
  # 假绿红线：本 job 不用 continue-on-error、不用 if: always()、不通过跳过测试冒充通过；
  # static-gate 失败时本 job 随 needs 失败传播，不产出 success 结论。它不替代码变车道的
  # 3185 基线总数断言——那条结论只由 test-aggregate 在码变车道给出。
  lane-summary:
    name: Lane summary (docs-only / scripts-only gate)
    needs: [classify-paths, static-gate]
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.baseline_full_test != true) && needs.classify-paths.outputs.code_changed == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record non-code lane conclusion
        run: |
          python3 - <<'PY'
          import sys
          lane = '${{ needs.classify-paths.outputs.lane }}'
          if lane not in ('docs-only', 'scripts-only'):
              sys.exit('::error::lane=%s 不在非码变车道枚举内（docs-only / scripts-only）' % lane)
          print('lane=%s 非码变车道：静态门禁已过，Android 构建链本轮不拉起' % lane)
          print('本结论不替代码变车道的测试总数基线断言；码变车道结论见 test-aggregate。')
          PY

  # ---------- baseline 对照模式：workflow_dispatch 勾选 baseline_full_test 时单 job 跑全量 ----------
  test-baseline:
    name: Baseline full unit tests (single job)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_full_test == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 不用 actions/setup-java：4 个分片并发下载同一份 temurin 包时，Adoptium 下载接口会限流，
      # 实测 verify #1/#2 都是"discover（先跑、单路下载）绿、4 个分片全部红在 Set up JDK 这一步"。
      # runner 镜像本身预装 Temurin 21（JAVA_HOME_21_X64），本地可取、零网络；
      # 仅镜像缺 21 时才回落下拉，三次重试仍失败才红——红灯因此只会来自真实缺 JDK，而不是并发限流。
      - name: Set up JDK 21 (preinstalled, no network)
        run: |
          set -euo pipefail
          for H in "${JAVA_HOME_21_X64:-}" "${JAVA_HOME_21_ARM64:-}"; do
            if [ -n "$H" ] && [ -x "$H/bin/java" ]; then
              echo "JAVA_HOME=$H" >> "$GITHUB_ENV"
              echo "$H/bin" >> "$GITHUB_PATH"
              "$H/bin/java" -version 2>&1 | head -3
              echo "using preinstalled JDK21 at $H"
              exit 0
            fi
          done
          echo "::warning::runner 未预装 JDK21，回落下拉 temurin"
          for i in 1 2 3; do
            if curl -fsSL -o /tmp/jdk21.tar.gz \
              "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse"; then
              mkdir -p /opt/jdk21
              tar -xzf /tmp/jdk21.tar.gz -C /opt/jdk21 --strip-components=1
              echo "JAVA_HOME=/opt/jdk21" >> "$GITHUB_ENV"
              echo "/opt/jdk21/bin" >> "$GITHUB_PATH"
              /opt/jdk21/bin/java -version 2>&1 | head -3
              exit 0
            fi
            echo "::warning::jdk download attempt $i failed"; sleep 15
          done
          echo "::error::JDK21 三条路径都不可用（预装缺失 + 下载三次失败）"; exit 1

      - name: Install SDK components (skip when image preinstalled)
        run: |
          set -e
          # 快路径：镜像已带 platform 36 + build-tools 36.0.0 就直接跳过（每 job 省 30~60s，
          # 6 个 job 合计一轮省 3~6 分钟）。组件缺失才走原 retry 安装，安装语义一字未改。
          if [ -d "${ANDROID_HOME}/platforms/android-36" ] && [ -d "${ANDROID_HOME}/build-tools/36.0.0" ]; then
            echo "SDK 组件已预装，跳过 sdkmanager"; exit 0
          fi
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # Google 对同一 IP 的并发 sdkmanager 有 429 限流：4 个分片同时装同一套组件时
          # 偶发只成功 1 个、其余失败，会被误读成代码回归。故重试 3 次（间隔 20s），
          # 三次全失败才让 job 红，红灯含义仍是"组件装不上"而不是"测试没通过"。
          for i in 1 2 3; do
            if "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"; then
              echo "sdk components ok (attempt $i)"; exit 0
            fi
            echo "::warning::sdkmanager attempt $i failed, retry in 20s"; sleep 20
          done
          echo "::error::sdkmanager failed 3 times"; exit 1

      - name: Compute cache key inputs
        id: cachekey
        run: |
          set -e
          DIST="$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | tr -d '\\')"
          echo "dist-hash=$(printf '%s' "$DIST" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache Gradle wrapper and modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ steps.cachekey.outputs.dist-hash }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ steps.cachekey.outputs.dist-hash }}-
            gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Run all module unit tests and benches (baseline full)
        run: ./gradlew testAppDebugUnitTest --no-daemon --build-cache --stacktrace

      - name: Upload baseline JUnit XML results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-baseline
          path: app/build/test-results/testAppDebugUnitTest/*.xml
          if-no-files-found: warn
