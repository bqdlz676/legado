name: Package Debug APK

on:
  # 由 verify 车道成功完成后触发：verify 全绿才进入打包，并行触发被此闸门排除。
  # 注意：workflows 里填的是被监听 workflow 的 name 字段（verify.yml 的 "Verify (unit tests)"），
  # 不是文件名 "verify"。填文件名不会报错，但闸门永远不触发——第 5 轮实测脚手架静默失效，故此处按 name 精确匹配。
  workflow_run:
    workflows: ["Verify (unit tests)"]
    types: [completed]
  # 保留手动入口（baseline 对照模式直接出包等场景）。
  workflow_dispatch:
    inputs:
      baseline_full_test:
        description: 'baseline 模式：单 job 跑全量单测对照（默认 false 走 4 分片并行）'
        type: boolean
        default: false

permissions:
  contents: read

# 并发口径（2026-11-27 Q472 定稿，取代旧 K-20 注释）：
# - group 带 github.ref：同分支串行排队，跨分支互不进同一组、不互斥打断；组键不含事件名，
#   workflow_run 与 workflow_dispatch 落到同一 ref 时也排在同一队里，避免手动包插队在飞自动包。
# - cancel-in-progress: false（排队，不取消在飞）：APK 是全链最长杆（实测成功轮 ~10 分钟，
#   JDK/SDK/Gradle 依赖解析预热占前段），打断在飞构建等于整段预热作废且零产物落地；连推场景下
#   若取 true（新推取消旧跑），每个新提交都掐掉上一轮在飞包，推送不断则包永远跑不完——
#   3cf24a5 同批次两次 cancelled 即此形态。排队代价只是最多等一轮出包；Verify 车道已按 ref
#   排队（verify.yml 同口径 false），package 积压至多一条等待。
# - 用户视角保证：排队语义下每个码变提交的 package run 都跑到终态，队尾那条对应当前 HEAD 所验证
#   的提交，最后必有一个完成态 APK；不会出现"跑到一半被取消、没有可用包"。
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

# 口径与护栏（改动前先读）：
# - 本文件由原 build.yml 出包侧 job 逐字搬运；测试 job 见 verify.yml。
# - 跨 workflow 无法用 needs 引用 verify 内 job：原 build-shard 的 needs [discover, test-shard,
#   test-aggregate]、build-baseline 的 needs [test-baseline]，其等待关系改由本文件顶部
#   workflow_run(verify, conclusion == 'success') 闸门承担；job 内 steps / artifact 名称路径不变。
# - 缓存未命中时 actions/cache 自动跳过 restore，Gradle 正常走网络下载；任何位置都不加 --offline。

jobs:
  # ---------- 路径分流：先判本轮改动落在哪条车道（docs-only / scripts-only / code），纯 git diff，不装 JDK/Gradle ----------
  # 为什么 package 侧也要判车道：workflow_run 只监听 Verify completed；Verify 在 docs-only 车道
  # 也会由 lane-summary 给出显式 success 结论。package 若只看 conclusion == success，纯文档推送
  # 照样拉起 APK 长构建（Q429 报告 §九.1 遗留）。判据与 verify.yml classify-paths 逐字对齐，
  # 两条车道对同一批文件给出同一结论，避免 verify 判 docs-only、package 判 code 的口径分裂。
  classify-paths:
    name: Classify changed paths (lane)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
      lane: ${{ steps.classify.outputs.lane }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # workflow_run 事件默认检出源 run 的提交；显式指定 head_sha，手动触发回退 github.sha。
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Classify changed files into lane
        id: classify
        run: |
          python3 - <<'PY'
          import os, subprocess

          def git(*args):
              # quotepath=false：非 ASCII 路径（中文文件名）不被加引号转义，否则 app/、
              # data_scripts/ 等前缀匹配会被引号挡掉（同 verify.yml classify 口径）。
              r = subprocess.run(['git', '-c', 'core.quotepath=false', *args],
                                 capture_output=True, text=True)
              return r.returncode, r.stdout.strip()

          event = '${{ github.event_name }}'
          files = []

          if event == 'workflow_dispatch':
              # 手动触发保守按码变全量跑：baseline 对照/补跑不享受分流跳过（同 verify.yml 口径）。
              files = []
          else:
              # workflow_run 事件载荷没有 before 字段：取触发提交的父提交 diff；取不到父提交
              # （首推/浅克隆）时空集保守落 code，不允许跳过出包链。
              rc, parent = git('rev-parse', 'HEAD~1')
              base = parent if rc == 0 and parent else ''
              if base:
                  rc, out = git('diff', '--name-only', base, 'HEAD')
                  files = [f for f in out.splitlines() if f]

          # 码变白名单（与 verify.yml classify-paths 逐字对齐）：应用/模块/截图/三方源码、
          # Gradle 构建面、CI 配置与 composite action、版本号、两个被 workflow 直接调用的数据脚本。
          CODE_PREFIXES = ('app/', 'modules/', 'screenshot/', 'third_party/',
                           'gradle/', 'buildSrc/', '.github/')
          CODE_EXACT = {'build.gradle', 'settings.gradle', 'settings.gradle.kts',
                        'gradle.properties', 'gradlew', 'gradlew.bat',
                        '.versioncode', 'package.json'}
          CI_INVOKED_SCRIPTS = {'data_scripts/emit-shard-lists.py',
                                'data_scripts/frame-manifest.py'}

          def is_code(p):
              if p in CODE_EXACT or p in CI_INVOKED_SCRIPTS:
                  return True
              if p.endswith('.gradle') or p.endswith('.gradle.kts'):
                  return True
              return any(p.startswith(pre) for pre in CODE_PREFIXES)

          # 非码变域（可跳过 APK 构建）：docs/、data_scripts/、任意层级 *.md；
          # 优先级先判码变白名单——落在 app/ 等目录下的 *.md 仍按码变处理（与 verify.yml 同口径）。
          code_changed = any(is_code(p) for p in files)
          if not files:
              # 空集保守按码变：取不到 diff（首推/异常）时不允许跳过构建链。
              lane = 'code'
              code_changed = True
          elif code_changed:
              lane = 'code'
          elif any(p.startswith('data_scripts/') for p in files):
              lane = 'scripts-only'
          else:
              lane = 'docs-only'

          out_path = os.environ['GITHUB_OUTPUT']
          with open(out_path, 'a') as fh:
              fh.write('code_changed=%s\n' % ('true' if code_changed else 'false'))
              fh.write('lane=%s\n' % lane)
          print('lane=%s code_changed=%s' % (lane, code_changed))
          print('changed_files=%s' % files)
          PY

  # ---------- 出包（分片路径）：verify 车道全绿 + 本轮落码变车道后由双闸门放行 ----------
  build-shard:
    name: Build & verify APKs (shard path)
    needs: [classify-paths]
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'workflow_dispatch' || inputs.baseline_full_test != true) && needs.classify-paths.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 不用 actions/setup-java：4 个分片并发下载同一份 temurin 包时，Adoptium 下载接口会限流，
      # 实测 verify #1/#2 都是"discover（先跑、单路下载）绿、4 个分片全部红在 Set up JDK 这一步"。
      # runner 镜像本身预装 Temurin 21（JAVA_HOME_21_X64），本地可取、零网络；
      # 仅镜像缺 21 时才回落下拉，三次重试仍失败才红——红灯因此只会来自真实缺 JDK，而不是并发限流。
      - name: Set up JDK 21 (preinstalled, no network)
        run: |
          set -euo pipefail
          for H in "${JAVA_HOME_21_X64:-}" "${JAVA_HOME_21_ARM64:-}"; do
            if [ -n "$H" ] && [ -x "$H/bin/java" ]; then
              echo "JAVA_HOME=$H" >> "$GITHUB_ENV"
              echo "$H/bin" >> "$GITHUB_PATH"
              "$H/bin/java" -version 2>&1 | head -3
              echo "using preinstalled JDK21 at $H"
              exit 0
            fi
          done
          echo "::warning::runner 未预装 JDK21，回落下拉 temurin"
          for i in 1 2 3; do
            if curl -fsSL -o /tmp/jdk21.tar.gz \
              "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse"; then
              mkdir -p /opt/jdk21
              tar -xzf /tmp/jdk21.tar.gz -C /opt/jdk21 --strip-components=1
              echo "JAVA_HOME=/opt/jdk21" >> "$GITHUB_ENV"
              echo "/opt/jdk21/bin" >> "$GITHUB_PATH"
              /opt/jdk21/bin/java -version 2>&1 | head -3
              exit 0
            fi
            echo "::warning::jdk download attempt $i failed"; sleep 15
          done
          echo "::error::JDK21 三条路径都不可用（预装缺失 + 下载三次失败）"; exit 1

      - name: Install SDK components (skip when image preinstalled)
        run: |
          set -e
          # 快路径：镜像已带 platform 36 + build-tools 36.0.0 时直接跳过（每 job 省 30~60s，
          # 5~6 个 job 合计一轮省 3~6 分钟）。组件缺失才走原 retry 安装，语义不变。
          if [ -d "${ANDROID_HOME}/platforms/android-36" ] && [ -d "${ANDROID_HOME}/build-tools/36.0.0" ]; then
            echo "SDK 组件已预装，跳过 sdkmanager"; exit 0
          fi
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # Google 对同一 IP 的并发 sdkmanager 有 429 限流：4 个分片同时装同一套组件时
          # 偶发只成功 1 个、其余失败，会被误读成代码回归。故重试 3 次（间隔 20s），
          # 三次全失败才让 job 红，红灯含义仍是"组件装不上"而不是"测试没通过"。
          for i in 1 2 3; do
            if "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"; then
              echo "sdk components ok (attempt $i)"; exit 0
            fi
            echo "::warning::sdkmanager attempt $i failed, retry in 20s"; sleep 20
          done
          echo "::error::sdkmanager failed 3 times"; exit 1

      - name: Compute cache key inputs
        id: cachekey
        run: |
          set -e
          DIST="$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | tr -d '\\')"
          echo "dist-hash=$(printf '%s' "$DIST" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache Gradle wrapper and modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ steps.cachekey.outputs.dist-hash }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ steps.cachekey.outputs.dist-hash }}-
            gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Resolve versionCode (.versioncode single source)
        run: |
          VC="$(tr -d '[:space:]' < .versioncode)"
          echo "versionCode=$VC" | tee -a "$GITHUB_STEP_SUMMARY"
          if ! [[ "$VC" =~ ^[0-9]+$ ]] || (( VC < 38000 )); then
            echo "::error::.versioncode 非法或低于硬地板 38000: '$VC'"; exit 1
          fi

      - name: Build & verify APKs (shared composite)
        uses: ./.github/actions/build-apks

  # ---------- 出包（baseline 路径）：仅手动 workflow_dispatch 勾选 baseline_full_test 时运行 ----------
  build-baseline:
    name: Build & verify APKs (baseline path)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_full_test == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 不用 actions/setup-java：4 个分片并发下载同一份 temurin 包时，Adoptium 下载接口会限流，
      # 实测 verify #1/#2 都是"discover（先跑、单路下载）绿、4 个分片全部红在 Set up JDK 这一步"。
      # runner 镜像本身预装 Temurin 21（JAVA_HOME_21_X64），本地可取、零网络；
      # 仅镜像缺 21 时才回落下拉，三次重试仍失败才红——红灯因此只会来自真实缺 JDK，而不是并发限流。
      - name: Set up JDK 21 (preinstalled, no network)
        run: |
          set -euo pipefail
          for H in "${JAVA_HOME_21_X64:-}" "${JAVA_HOME_21_ARM64:-}"; do
            if [ -n "$H" ] && [ -x "$H/bin/java" ]; then
              echo "JAVA_HOME=$H" >> "$GITHUB_ENV"
              echo "$H/bin" >> "$GITHUB_PATH"
              "$H/bin/java" -version 2>&1 | head -3
              echo "using preinstalled JDK21 at $H"
              exit 0
            fi
          done
          echo "::warning::runner 未预装 JDK21，回落下拉 temurin"
          for i in 1 2 3; do
            if curl -fsSL -o /tmp/jdk21.tar.gz \
              "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse"; then
              mkdir -p /opt/jdk21
              tar -xzf /tmp/jdk21.tar.gz -C /opt/jdk21 --strip-components=1
              echo "JAVA_HOME=/opt/jdk21" >> "$GITHUB_ENV"
              echo "/opt/jdk21/bin" >> "$GITHUB_PATH"
              /opt/jdk21/bin/java -version 2>&1 | head -3
              exit 0
            fi
            echo "::warning::jdk download attempt $i failed"; sleep 15
          done
          echo "::error::JDK21 三条路径都不可用（预装缺失 + 下载三次失败）"; exit 1

      - name: Install SDK components (skip when image preinstalled)
        run: |
          set -e
          # 快路径：镜像已带 platform 36 + build-tools 36.0.0 时直接跳过（每 job 省 30~60s，
          # 5~6 个 job 合计一轮省 3~6 分钟）。组件缺失才走原 retry 安装，语义不变。
          if [ -d "${ANDROID_HOME}/platforms/android-36" ] && [ -d "${ANDROID_HOME}/build-tools/36.0.0" ]; then
            echo "SDK 组件已预装，跳过 sdkmanager"; exit 0
          fi
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # Google 对同一 IP 的并发 sdkmanager 有 429 限流：4 个分片同时装同一套组件时
          # 偶发只成功 1 个、其余失败，会被误读成代码回归。故重试 3 次（间隔 20s），
          # 三次全失败才让 job 红，红灯含义仍是"组件装不上"而不是"测试没通过"。
          for i in 1 2 3; do
            if "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"; then
              echo "sdk components ok (attempt $i)"; exit 0
            fi
            echo "::warning::sdkmanager attempt $i failed, retry in 20s"; sleep 20
          done
          echo "::error::sdkmanager failed 3 times"; exit 1

      - name: Compute cache key inputs
        id: cachekey
        run: |
          set -e
          DIST="$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | tr -d '\\')"
          echo "dist-hash=$(printf '%s' "$DIST" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache Gradle wrapper and modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ steps.cachekey.outputs.dist-hash }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ steps.cachekey.outputs.dist-hash }}-
            gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Resolve versionCode (.versioncode single source)
        run: |
          VC="$(tr -d '[:space:]' < .versioncode)"
          echo "versionCode=$VC" | tee -a "$GITHUB_STEP_SUMMARY"
          if ! [[ "$VC" =~ ^[0-9]+$ ]] || (( VC < 38000 )); then
            echo "::error::.versioncode 非法或低于硬地板 38000: '$VC'"; exit 1
          fi

      - name: Build & verify APKs (shared composite)
        uses: ./.github/actions/build-apks

  # ---------- 非码变车道汇总：docs-only / scripts-only 给出显式"本轮不出包"结论 ----------
  # 为什么独立成 job：needs 只挂恒存在的 classify-paths，不依赖会被整链跳过的 build-shard；
  # 与 verify.yml lane-summary 同口径。不用 continue-on-error、不用 if: always()；classify 失败时
  # 本 job 随 needs 失败传播，不产出放行结论。本结论不替代码变车道的 APK 构建与产物校验。
  lane-summary:
    name: Package lane summary (non-code gate)
    needs: [classify-paths]
    if: ${{ github.event_name != 'workflow_dispatch' && needs.classify-paths.outputs.code_changed == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record non-code lane conclusion
        run: |
          python3 - <<'PY'
          import sys
          lane = '${{ needs.classify-paths.outputs.lane }}'
          if lane not in ('docs-only', 'scripts-only'):
              sys.exit('::error::lane=%s 不在非码变车道枚举内（docs-only / scripts-only）' % lane)
          print('lane=%s 非码变车道：本轮改动不触达 APK 构建面，出包链不拉起；APK 产物对应上一条码变车道包。' % lane)
          PY
