name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platforms 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Grant gradlew
        run: chmod +x gradlew

      - name: Build debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: legado-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
