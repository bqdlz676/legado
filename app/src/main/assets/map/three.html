<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D 沙盘</title>
<style>
  html,body{margin:0;height:100%;background:#1C1A14;overflow:hidden;font-family:serif;}
  #c{position:absolute;inset:0;touch-action:none;}
  #grain{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:.5;}
  #top{position:absolute;left:0;right:0;top:0;z-index:10;padding:12px 14px;
    display:flex;align-items:center;gap:10px;
    background:linear-gradient(180deg,rgba(28,26,20,.92),rgba(28,26,20,0));color:#E6DAC0;}
  #top .nm{font-size:16px;letter-spacing:.08em;color:#EFE3C8;}
  #top .sub{font-size:11px;color:#9B9687;margin-top:3px;}
  #top button{margin-left:auto;border:1px solid rgba(139,105,20,.55);background:rgba(247,241,230,.06);color:#D8CEB4;
    font-size:12px;padding:6px 12px;border-radius:3px;font-family:inherit;}
  #tips{position:absolute;left:12px;bottom:12px;z-index:10;font-size:11px;color:#8C8570;
    background:rgba(28,26,20,.72);padding:5px 10px;border-radius:3px;}
  #panel{position:absolute;right:12px;bottom:12px;z-index:10;display:flex;flex-direction:column;gap:8px;}
  #panel button{border:1px solid rgba(139,105,20,.45);background:rgba(247,241,230,.05);color:#C9C0A6;
    font-size:12px;padding:7px 12px;border-radius:3px;font-family:inherit;}
  #panel button.on{background:#D4A54A;color:#1C1A14;border-color:#D4A54A;}
  #log{position:absolute;left:12px;top:78px;z-index:10;max-width:58%;font-size:11px;
    color:#B3A98E;background:rgba(28,26,20,.8);padding:8px 12px;border-radius:3px;
    border:1px solid rgba(139,105,20,.3);line-height:1.7;display:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="grain"></div>
<div id="top">
  <div>
    <div class="nm" id="nm">沙盘</div>
    <div class="sub" id="sub"></div>
  </div>
  <button onclick="location.href='index.html'+location.search">二维图</button>
</div>
<div id="log"></div>
<div id="tips">单指拖动旋转　双指缩放　点地形落兵</div>
<div id="panel">
  <button id="bBattle" onclick="location.href='battle.html?c=gaixia&y='+(place.year||'')">推演</button>
  <button id="bRoute" class="on">行军路线</button>
  <button id="bReset">清空</button>
  <button id="bRot">自动旋转</button>
</div>
<script src="three.min.js"></script>
<script src="china_height.js"></script>
<script src="cities.js"></script>
<script src="world_places.js"></script>
<script>
// 绢帛织物颗粒：64×64 随机噪点平铺，覆盖整幅画面
(function () {
  var g = document.getElementById('grain');
  var cv = document.createElement('canvas');
  cv.width = 64; cv.height = 64;
  var x = cv.getContext('2d');
  var img = x.createImageData(64, 64);
  for (var i = 0; i < img.data.length; i += 4) {
    var v = 128 + Math.floor(Math.random() * 44 - 22);
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 22;
  }
  x.putImageData(img, 0, 0);
  g.style.backgroundImage = 'url(' + cv.toDataURL() + ')';
  g.style.backgroundRepeat = 'repeat';
})();

var place = (function () {
  try {
    var q = location.search.replace(/^\?/, '');
    var m = /(?:^|&)d=([^&]+)/.exec(q);
    if (m) return JSON.parse(decodeURIComponent(m[1]));
  } catch (e) {}
  return {name:"", lat:34.6, lng:113.0, zoom:7};
})();
document.getElementById('nm').textContent = (place.name || '地形沙盘') + ' · 3D';
document.getElementById('sub').textContent = place.modern ? ('今 ' + place.modern) : '示意地形，非实测高程';

var W = innerWidth, H = innerHeight;
var canvas = document.getElementById('c');
var renderer = new THREE.WebGLRenderer({canvas: canvas, antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W, H, false);

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x1C1A14);
scene.fog = new THREE.Fog(0x1C1A14, 240, 640);

var camera = new THREE.PerspectiveCamera(46, W / H, 0.1, 2000);
camera.position.set(0, 135, 190);
camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0x7A6444, 0.55));
var sun = new THREE.DirectionalLight(0xFFDCA8, 1.3);
sun.position.set(-140, 205, 70);
scene.add(sun);
var rim = new THREE.DirectionalLight(0x2F3A44, 0.38);
rim.position.set(155, 60, -150);
scene.add(rim);

// ---- 真实高程：512×512 灰度图（104°E–122°E / 24°N–42°N），0–255 = 0–3000m ----
var SEG = 160, SIZE = 300;
var HG = { w: 104, e: 122, s: 24, n: 42, px: 512 };
var hdata = new Uint8Array(HG.px * HG.px);
var terrain = null;
var TARGET = new THREE.Vector3(0, 0, 0);

function lonU(lng) { return (lng - HG.w) / (HG.e - HG.w) * SIZE - SIZE / 2; }
function latV(lat) {
  var latRad = lat * Math.PI / 180;
  var y = Math.log(Math.tan(Math.PI / 4 + latRad / 2));
  var yNorth = Math.log(Math.tan(Math.PI / 4 + HG.n * Math.PI / 360));
  var ySouth = Math.log(Math.tan(Math.PI / 4 + HG.s * Math.PI / 360));
  return (y - yNorth) / (ySouth - yNorth) * SIZE - SIZE / 2;
}

function hAt(x, z) {
  var u = (x + SIZE / 2) / SIZE * (HG.px - 1);
  var v = (z + SIZE / 2) / SIZE * (HG.px - 1);
  var iu = Math.max(0, Math.min(HG.px - 2, Math.floor(u)));
  var iv = Math.max(0, Math.min(HG.px - 2, Math.floor(v)));
  var fu = u - iu, fv = v - iv;
  var i00 = iv * HG.px + iu, i10 = i00 + 1, i01 = i00 + HG.px, i11 = i01 + 1;
  var a = hdata[i00], b = hdata[i10], c = hdata[i01], d = hdata[i11];
  return (a * (1 - fu) * (1 - fv) + b * fu * (1 - fv) + c * (1 - fu) * fv + d * fu * fv) / 255 * 3000;
}
function yOf(x, z) { return hAt(x, z) * 0.015; }

// 高程以 base64 内嵌在 china_height.js 里，避开 file:// 页面的 canvas 跨域污染
(function () {
  try {
    var raw = atob(window.CHINA_H_B64 || '');
    var n = Math.min(raw.length, HG.px * HG.px);
    for (var i = 0; i < n; i++) hdata[i] = raw.charCodeAt(i);
    if (n > 0) buildTerrain();
    else document.getElementById('sub').textContent = '高程数据未载入';
  } catch (e) {
    document.getElementById('sub').textContent = '高程数据未载入';
  }
})();

function buildTerrain() {
  var geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
  geo.rotateX(-Math.PI / 2);
  var pos = geo.attributes.position;
  for (var i = 0; i < pos.count; i++) {
    pos.setY(i, yOf(pos.getX(i), pos.getZ(i)));
  }
  geo.computeVertexNormals();

  var colors = [];
  var pc = geo.attributes.position;
  var nrmAttr = geo.attributes.normal;
  var LIGHT = new THREE.Vector3(-0.42, 0.80, 0.42).normalize();
  var cLow = new THREE.Color(0x3A4048);
  var cMid = new THREE.Color(0x6E6046);
  var cHigh = new THREE.Color(0xB8A88A);
  var cTop = new THREE.Color(0xCEC2A8);
  for (var j = 0; j < pc.count; j++) {
    var e = hAt(pc.getX(j), pc.getZ(j));
    var col;
    if (e < 20) {
      col = new THREE.Color(0x394852);
    } else if (e < 480) {
      col = new THREE.Color(0x49545C).lerp(new THREE.Color(0x5E6050), e / 480);
    } else if (e < 1100) {
      col = new THREE.Color(0x5E6050).lerp(new THREE.Color(0x77684A), (e - 480) / 620);
    } else if (e < 2200) {
      col = new THREE.Color(0x77684A).lerp(cHigh, (e - 1100) / 1100);
    } else {
      col = cHigh.clone().lerp(cTop, Math.min(1, (e - 2200) / 900));
    }
    // 明暗烘焙：左上暖光，背光面压暗，避免灯光把颜色整体染黄
    var nx = nrmAttr.getX(j), ny = nrmAttr.getY(j), nz = nrmAttr.getZ(j);
    var nd = Math.max(0, nx * LIGHT.x + ny * LIGHT.y + nz * LIGHT.z);
    var k = 0.5 + 0.62 * nd;
    colors.push(col.r * k, col.g * k, col.b * k);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

  terrain = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({vertexColors: true}));
  scene.add(terrain);

  var grid = new THREE.GridHelper(SIZE, 24, 0x3A3324, 0x241F16);
  grid.position.y = -8;
  scene.add(grid);

  TARGET.set(lonU(place.lng), 0, latV(place.lat));
  placeLabels();
}

// 地名标签（始终朝向相机）
function label(text, x, y, z, color) {
  var cv = document.createElement('canvas');
  cv.width = 256; cv.height = 64;
  var g = cv.getContext('2d');
  g.fillStyle = 'rgba(10,12,20,0.0)';
  g.fillRect(0, 0, 256, 64);
  g.font = '28px serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = color || '#E6DAC0';
  g.fillText(text, 128, 32);
  var tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearFilter;
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({map: tex, transparent: true, depthTest: false}));
  sp.position.set(x, y, z);
  sp.scale.set(26, 6.5, 1);
  scene.add(sp);
  return sp;
}

// 当前地名居中，周边城市标点（真实经纬 → 地形坐标）
function placeLabels() {
  var cx = lonU(place.lng), cz = latV(place.lat);
  label(place.name || '地形沙盘', cx, yOf(cx, cz) + 10, cz, '#FFD98A');

  var near = [];
  Object.keys(window.CITIES || {}).forEach(function (n) {
    if (n === place.name) return;
    var c = window.CITIES[n];
    var lat = c[0], lng = c[1];
    if (lng < HG.w || lng > HG.e || lat < HG.s || lat > HG.n) return;
    var x = lonU(lng), z = latV(lat);
    var d = Math.sqrt((x - cx) * (x - cx) + (z - cz) * (z - cz));
    if (d < 130) near.push({n: n, x: x, z: z, d: d});
  });
  near.sort(function (a, b) { return a.d - b.d; });
  near.slice(0, 22).forEach(function (p) {
    var h = yOf(p.x, p.z);
    var v = new THREE.Vector3(p.x, h + 2, p.z);
    var dot = new THREE.Mesh(
      new THREE.SphereGeometry(1.4, 10, 10),
      new THREE.MeshBasicMaterial({color: 0xD4A54A})
    );
    dot.position.copy(v);
    scene.add(dot);
    label(p.n, p.x, h + 7, p.z, '#B9B09A');
  });
}

// ---- 交互 ----
var dragging = false, lastX = 0, lastY = 0, rotY = 0, rotX = 0, dist = 300;
var autoRot = false;
var routeMode = true;
var raycaster = new THREE.Raycaster();
var routePts = [], routeLine = null;
var markerGroup = new THREE.Group();
scene.add(markerGroup);

canvas.addEventListener('pointerdown', function (e) {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  rotY += (e.clientX - lastX) * 0.006;
  rotX = Math.max(-0.55, Math.min(0.5, rotX + (e.clientY - lastY) * 0.004));
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('pointerup', function (e) {
  dragging = false;
  if (routeMode && Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY) < 3) {
    dropPoint(e.clientX, e.clientY);
  }
});
canvas.addEventListener('wheel', function (e) {
  dist = Math.max(90, Math.min(560, dist + e.deltaY * 0.35));
  e.preventDefault();
}, {passive: false});

var pinchStart = 0;
canvas.addEventListener('touchmove', function (e) {
  if (e.touches.length === 2) {
    var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (!pinchStart) pinchStart = d;
    dist = Math.max(90, Math.min(560, dist - (d - pinchStart) * 0.8));
    pinchStart = d;
    e.preventDefault();
  }
}, {passive: false});
canvas.addEventListener('touchend', function () { pinchStart = 0; });

function dropPoint(cx, cy) {
  var nx = (cx / W) * 2 - 1, ny = -(cy / H) * 2 + 1;
  raycaster.setFromCamera({x: nx, y: ny}, camera);
  var hit = raycaster.intersectObject(terrain);
  if (!hit.length) return;
  var p = hit[0].point.clone();
  var flag = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5, 0.5, 9, 8),
    new THREE.MeshBasicMaterial({color: 0xB33A2B})
  );
  flag.position.set(p.x, p.y + 4.5, p.z);
  markerGroup.add(flag);
  routePts.push(p);

  if (routePts.length > 1) {
    var a = routePts[routePts.length - 2], b = routePts[routePts.length - 1];
    var d = a.distanceTo(b);
    // 地形单位换算：300 单位覆盖 18 个纬度经度 ≈ 1730 公里
    var km = (d / 300) * 1730;
    var days = Math.max(1, Math.round(km / 15));
    if (routeLine) scene.remove(routeLine);
    var lineGeo = new THREE.BufferGeometry().setFromPoints(routePts.map(function (q) {
      return new THREE.Vector3(q.x, q.y + 1.2, q.z);
    }));
    routeLine = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({color: 0xE0B459}));
    scene.add(routeLine);
    var lg = document.getElementById('log');
    lg.style.display = 'block';
    lg.innerHTML = '点位 ' + routePts.length +
      '<br>直距约 ' + km.toFixed(0) + ' 里换算外<br>按日行 30 里推 ' + days + ' 日';
  }
}
document.getElementById('bReset').onclick = function () {
  while (markerGroup.children.length) markerGroup.remove(markerGroup.children[0]);
  if (routeLine) { scene.remove(routeLine); routeLine = null; }
  routePts = [];
  document.getElementById('log').style.display = 'none';
};
document.getElementById('bRot').onclick = function () {
  autoRot = !autoRot;
  this.className = autoRot ? 'on' : '';
};
document.getElementById('bRoute').onclick = function () {
  routeMode = !routeMode;
  this.className = routeMode ? 'on' : '';
};

function animate() {
  requestAnimationFrame(animate);
  if (autoRot && !dragging) rotY += 0.0016;
  var cx = TARGET.x + Math.sin(rotY) * dist * Math.cos(rotX + 0.28);
  var cz = TARGET.z + Math.cos(rotY) * dist * Math.cos(rotX + 0.28);
  var cy = TARGET.y + 135 + Math.sin(rotX + 0.28) * dist * 0.5;
  camera.position.set(cx, cy, cz);
  camera.lookAt(TARGET);
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', function () {
  W = innerWidth; H = innerHeight;
  camera.aspect = W / H; camera.updateProjectionMatrix();
  renderer.setSize(W, H, false);
});
</script>
</body>
</html>
