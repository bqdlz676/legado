<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>古今地图</title>
<link rel="stylesheet" href="leaflet.css">
<style>
  html,body{margin:0;padding:0;height:100%;background:#FBF6EA;font-family:serif;}
  #map{position:absolute;inset:0;}
  #bar{
    position:absolute;left:0;right:0;top:0;z-index:900;
    display:flex;align-items:center;gap:8px;padding:10px 14px;
    background:linear-gradient(180deg,rgba(251,246,234,.96),rgba(251,246,234,.72));
    border-bottom:1px solid rgba(160,140,110,.18);
  }
  #bar .name{font-size:17px;color:#2B2419;letter-spacing:.06em;}
  #bar .now{font-size:12px;color:#8A7A5E;}
  #tabs{margin-left:auto;display:flex;gap:6px;}
  #tabs button{
    border:1px solid #D9CDB6;background:#FFFDF6;color:#5A4E38;
    font-size:12px;padding:5px 10px;border-radius:14px;font-family:inherit;
  }
  #tabs button.on{background:#2B2419;color:#F6EFDF;border-color:#2B2419;}
  .lbl{
    background:rgba(251,246,234,.92);border:1px solid #C9B995;border-radius:3px;
    padding:2px 7px;font-size:12px;color:#3A3122;white-space:nowrap;
    box-shadow:0 1px 3px rgba(0,0,0,.12);
  }
  .lbl.old{border-color:#A8894F;color:#6A4E22;}
  .dot{width:8px;height:8px;border-radius:50%;background:#8A6A3E;border:1.5px solid #FBF6EA;
       box-shadow:0 0 0 1px rgba(120,95,55,.5);}
  #hint{
    position:absolute;left:14px;bottom:14px;z-index:900;
    font-size:11px;color:#8A7A5E;background:rgba(251,246,234,.86);
    padding:4px 9px;border-radius:4px;border:1px solid rgba(160,140,110,.2);
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="bar">
  <div>
    <div class="name" id="n"></div>
    <div class="now" id="m"></div>
  </div>
  <div id="tabs">
    <button id="t1" class="on">古今对照</button>
    <button id="t2">地形</button>
    <button id="t3">卫星</button>
  </div>
</div>
<div id="hint">双指缩放，拖动平移</div>

<script src="leaflet.js"></script>
<script>
var place = (function () {
  try {
    var q = location.search.replace(/^\?/, '');
    var m = /(?:^|&)d=([^&]+)/.exec(q);
    if (m) return JSON.parse(decodeURIComponent(m[1]));
  } catch (e) {}
  return window.__PLACE__ ||
 {name:"", note:"", modern:"", lat:34.6, lng:113.0, old:[]};
})();

document.getElementById('n').textContent = place.name || '古地名';
document.getElementById('m').textContent =
  (place.modern ? '今 ' + place.modern : '') + (place.note ? '　' + place.note : '');

var map = L.map('map', {zoomControl:false, attributionControl:false})
    .setView([place.lat, place.lng], place.zoom || 8);

var layers = {};
layers.modern = L.tileLayer(
  'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
  {subdomains:'1234', maxZoom:18});
layers.terrain = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:13});
layers.sat = L.tileLayer(
  'https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
  {subdomains:'1234', maxZoom:18});

layers.modern.addTo(map);

// 当前地名
var cur = L.marker([place.lat, place.lng], {
  icon: L.divIcon({className:'', html:'<div class="dot"></div>', iconSize:[8,8]})
}).addTo(map);
cur.bindTooltip(place.name + (place.modern ? '（今 ' + place.modern + '）' : ''),
  {permanent:true, direction:'top', className:'lbl old', offset:[0,-6]});

// 同区域古今地名点
(place.old || []).forEach(function (p) {
  var m = L.marker([p.lat, p.lng], {
    icon: L.divIcon({className:'', html:'<div class="dot" style="background:#7C6BA8"></div>',
                     iconSize:[8,8]})
  }).addTo(map);
  m.bindTooltip(p.name + (p.modern ? '｜' + p.modern : ''),
    {permanent:true, direction:'top', className:'lbl', offset:[0,-6]});
});

function pick(k, btn) {
  map.eachLayer(function (l) { if (l instanceof L.TileLayer) map.removeLayer(l); });
  layers[k].addTo(map);
  layers[k].bringToBack();
  ['t1','t2','t3'].forEach(function (id) {
    document.getElementById(id).className = '';
  });
  btn.className = 'on';
}
document.getElementById('t1').onclick = function () { pick('modern', this); };
document.getElementById('t2').onclick = function () { pick('terrain', this); };
document.getElementById('t3').onclick = function () { pick('sat', this); };

// 通知原生：就绪
if (window.Android && window.Android.onReady) window.Android.onReady();
</script>
</body>
</html>
