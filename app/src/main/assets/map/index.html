<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>古今地图</title>
<link rel="stylesheet" href="leaflet.css">
<style>
:root{
--bg-page:#F7F1E6;--bg-surface:#EFE8D8;--bg-overlay:rgba(26,20,16,.45);
--text-primary:#1A1410;--text-secondary:#5C4F3A;--text-tertiary:#9B9687;--text-accent:#C23B2E;
--brand-gold:#D4A54A;--brand-copper:#8B6914;--color-link:#C23B2E;--color-divider:rgba(26,20,16,.08);--color-glow:rgba(212,165,74,.3);
--font-body:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
--font-title:'Source Han Serif SC','Noto Serif SC',serif;
--font-label:'Noto Sans SC','PingFang SC',sans-serif;
--font-number:'Inter',ui-monospace,monospace;
--font-size-body:clamp(16px,4.5vw,20px);--line-height-body:1.8;--letter-spacing-body:.02em;
}
body{background:var(--bg-page);color:var(--text-primary);font-family:var(--font-body);line-height:var(--line-height-body);letter-spacing:var(--letter-spacing-body)}

  html,body{margin:0;padding:0;height:100%;background:#FBF6EA;font-family:serif;}
  #map{position:absolute;inset:0;}
  #bar{position:absolute;left:0;right:0;top:0;z-index:900;padding:9px 12px 8px;
    background:linear-gradient(180deg,rgba(251,246,234,.97),rgba(251,246,234,.80));
    border-bottom:1px solid rgba(160,140,110,.18);}
  #bar .name{font-size:17px;color:#2B2419;letter-spacing:.06em;}
  #bar .now{font-size:12px;color:#8A7A5E;margin-top:2px;}
  .row{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;}
  .row button{border:1px solid #D9CDB6;background:#FFFDF6;color:#5A4E38;
    font-size:12px;padding:4px 9px;border-radius:13px;font-family:inherit;}
  .row button.on{background:#2B2419;color:#F6EFDF;border-color:#2B2419;}
  .row button.off{opacity:.42;}
  .lbl{background:rgba(251,246,234,.93);border:1px solid #C9B995;border-radius:3px;
    padding:2px 7px;font-size:12px;color:#3A3122;white-space:nowrap;
    box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .lbl.old{border-color:#A8894F;color:#6A4E22;font-weight:600;}
  .dot{width:9px;height:9px;border-radius:50%;background:#8A6A3E;border:1.5px solid #FBF6EA;
       box-shadow:0 0 0 1px rgba(120,95,55,.5);}
  .dot.ev{background:#B33A2B;}
  .dot.st{background:#2E7D6B;}
  .dot.wp{background:#3F5C9A;}
  #hint{position:absolute;left:12px;bottom:12px;z-index:900;font-size:11px;color:#8A7A5E;
    background:rgba(251,246,234,.86);padding:4px 9px;border-radius:4px;
    border:1px solid rgba(160,140,110,.2);}
  #tl{position:absolute;left:0;right:0;bottom:0;z-index:950;max-height:52%;overflow:auto;
    background:rgba(251,246,234,.98);border-top:1px solid #D9CDB6;display:none;padding:10px 14px 22px;}
  #tl h4{margin:0 0 8px;font-size:13px;color:#8A7A5E;letter-spacing:.2em;font-weight:400;}
  #tl .it{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed rgba(160,140,110,.22);font-size:13px;}
  #tl .y{width:104px;color:#8A6A3E;flex:none;}
  #tl .c{color:#2B2419;}
  #tl .w{color:#3F5C9A;}
  #tl .close{position:absolute;right:12px;top:8px;font-size:12px;color:#8A7A5E;background:none;border:0;}
</style>
</head>
<body>
<div id="map"></div>
<div id="bar">
  <div class="name" id="n"></div>
  <div class="now" id="m"></div>
  <div class="row">
    <button id="t1" class="on">中国</button>
    <button id="t2">地形</button>
    <button id="t3">卫星</button>
    <button id="t4">世界</button>
    <button id="t5">3D 沙盘</button>
  </div>
  <div class="row">
    <button id="o1" class="on">史事</button>
    <button id="o2" class="on">势力</button>
    <button id="o3" class="on">名胜</button>
    <button id="o4" class="on">世界</button>
    <button id="o5">对照</button>
  </div>
  <div class="row">
    <button id="y1" class="on">全部</button>
    <button id="y2">先秦</button>
    <button id="y3">汉唐</button>
    <button id="y4">宋元</button>
    <button id="y5">明清</button>
  </div>
</div>
<div id="hint">拖动平移，双指缩放</div>
<div id="tl"><button class="close" onclick="document.getElementById('tl').style.display='none'">关闭</button><h4>中 外 同 期</h4><div id="tlb"></div></div>

<script src="leaflet.js"></script>
<script src="events.js"></script>
<script src="powers.js"></script>
<script src="powers_poly.js"></script>
<script src="sites.js"></script>
<script src="world_places.js"></script>
<script src="world_events.js"></script>
<script src="timeline.js"></script>
<script>
var place = (function () {
  try {
    var q = location.search.replace(/^\?/, '');
    var m = /(?:^|&)d=([^&]+)/.exec(q);
    if (m) return JSON.parse(decodeURIComponent(m[1]));
  } catch (e) {}
  return window.__PLACE__ || {name:"", note:"", modern:"", lat:34.6, lng:113.0, old:[], wlat:null, wlng:null};
})();

document.getElementById('n').textContent = place.name || '地名';
document.getElementById('m').textContent =
  (place.modern ? '今 ' + place.modern : '') + (place.note ? '　' + place.note : '');

var start = (place.wlat != null && place.wlng != null) ? [place.wlat, place.wlng] : [place.lat, place.lng];
var map = L.map('map', {zoomControl:false, attributionControl:false})
    .setView(start, place.zoom || (place.wlat != null ? 4 : 7));

// 半屏 sheet 里的缩略图：只读，禁掉所有手势，避免和 sheet 下拉打架
if (place.still) {
  map.dragging.disable();
  map.touchZoom.disable();
  map.doubleClickZoom.disable();
  map.scrollWheelZoom.disable();
  map.boxZoom.disable();
  map.keyboard.disable();
}

var base = {
  cn: L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {subdomains:'1234', maxZoom:18}),
  terrain: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}', {maxZoom:13}),
  sat: L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', {subdomains:'1234', maxZoom:18}),
  world: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {maxZoom:18})
};
(place.wlat != null ? base.world : base.cn).addTo(map);

var Y = ['全部','先秦','汉唐','宋元','明清'];
var ERA_LABEL = '图层随锚点';
var curY = 0;
// 锚点年进来时先落档：这决定看到的是春秋晋还是汉代晋
(function () {
  var y = place.year;
  if (typeof y !== 'number' || y < -9999) return;
  curY = y < 0 ? 1 : (y < 907 ? 2 : (y < 1368 ? 3 : 4));
})();
// 锚点年 → 朝代。地图分朝代不是靠手感，是这一个函数说了算
var anchorYear = (typeof place.year === 'number' && place.year > -9999) ? place.year : null;
function dynastyOfYear(y) {
  if (y < -476) return '春秋';
  if (y < -221) return '战国';
  if (y < -206) return '秦';
  if (y <= 8) return '西汉';
  if (y <= 220) return '东汉';
  if (y <= 280) return '三国';
  if (y <= 589) return '晋';
  if (y <= 907) return '唐';
  if (y <= 960) return '五代';
  if (y <= 1279) return '宋';
  if (y <= 1368) return '元';
  if (y <= 1644) return '明';
  return '清';
}
var ERA_SPAN = {
  '春秋': [-770, -476], '战国': [-476, -221], '秦': [-221, -206],
  '西汉': [-206, 9], '东汉': [25, 221], '三国': [220, 281], '晋': [265, 590],
  '唐': [618, 908], '五代': [907, 961], '宋': [960, 1280],
  '元': [1271, 1369], '明': [1368, 1645], '清': [1644, 1912]
};

function inEra(y) {
  if (anchorYear != null) {
    var d0 = dynastyOfYear(anchorYear), sp0 = ERA_SPAN[d0];
    return sp0 ? (y >= sp0[0] && y < sp0[1]) : true;
  }
  if (curY === 0) return true;
  if (curY === 1) return y < 0;
  if (curY === 2) return y >= -206 && y < 907;
  if (curY === 3) return y >= 907 && y < 1368;
  return y >= 1368 && y < 1912;
}

function inEraName(era) {
  if (anchorYear != null) {
    var d = dynastyOfYear(anchorYear);
    if (d === '春秋' || d === '战国') return era === '春秋' || era === '战国';
    if (d === '宋') return era === '北宋' || era === '南宋';
    if (d === '三国') return era === '三国' || era === '东汉' || era === '西汉';
    return era === d;
  }
  if (curY === 0) return true;
  if (curY === 1) return era === '春秋' || era === '战国';
  if (curY === 2) return era === '西汉' || era === '新' || era === '东汉' || era === '三国' || era === '唐';
  if (curY === 3) return era === '北宋' || era === '南宋' || era === '元';
  return era === '明' || era === '清';
}

// 示意色块层：不是边界，只表势力范围；tier 3 一律标「示意」
var gCircle = L.layerGroup().addTo(map);
(window.POWERS_CIRCLE || []).forEach(function (p) {
  if (!inEraName(p.era)) return;
  L.circle([p.center[0], p.center[1]], {
    radius: p.r * 1000, color: p.color, weight: 1,
    opacity: .55, fillColor: p.color, fillOpacity: .12
  }).addTo(gCircle)
   .bindTooltip(p.name + '（' + p.era + '·示意）', {permanent:true, direction:'center', className:'lbl', opacity:.85});
});


// 分朝代疆域层：一条对应一个政权/辖区，from/to 与 era 双条件过筛
// tier3 一律虚线，表示文献推定的势力范围，不是实测边界
var gPoly = L.layerGroup().addTo(map);
(window.POWERS_POLY || []).forEach(function (p) {
  if (!inEraName(p.era)) return;
  L.polygon(p.pts, {
    color: p.color, weight: 1.2, opacity: .6, dashArray: '4 4',
    fillColor: p.color, fillOpacity: .13
  }).addTo(gPoly)
   .bindTooltip(p.name + '（' + p.era + '·推定疆域）', {permanent:true, direction:'center', className:'lbl', opacity:.8});
});

var gPower = L.layerGroup().addTo(map);
(window.POWERS || []).forEach(function (p) {
  if (!p.poly || !p.poly.length) return;
  L.polygon(p.poly, {color:p.color, weight:1.2, opacity:.75, fillColor:p.color, fillOpacity:.16})
   .addTo(gPower)
   .bindTooltip(p.name + '（' + p.era + '）', {permanent:true, direction:'center', className:'lbl', opacity:1});
});

function evLayer(list, color, group) {
  list.forEach(function (e) {
    var lat = e.lat, lng = e.lng;
    if (lat == null && window.CITIES && window.CITIES[e.place]) { lat = window.CITIES[e.place][0]; lng = window.CITIES[e.place][1]; }
    if (lat == null || lng == null) return;
    if (!inEra(e.year)) return;
    var m = L.marker([lat, lng], {
      icon: L.divIcon({className:'', html:'<div class="dot ev" style="background:' + color + '"></div>', iconSize:[9,9]})
    }).addTo(group);
    var y = e.year < 0 ? '前' + (-e.year) + '年' : e.year + '年';
    m.bindTooltip(e.name, {direction:'top', className:'lbl', offset:[0,-6]});
    m.bindPopup('<div style="font-family:serif;max-width:220px"><b>' + e.name + '</b><br>' +
      y + (e.tag ? '　' + e.tag : '') + '<br>' + (e.note || '') + '</div>');
  });
}

var gEvent = L.layerGroup().addTo(map);
evLayer(window.EVENTS || [], '#B33A2B', gEvent);

var gSite = L.layerGroup().addTo(map);
(window.SITES || []).forEach(function (s) {
  var m = L.marker([s.lat, s.lng], {
    icon: L.divIcon({className:'', html:'<div class="dot st"></div>', iconSize:[9,9]})
  }).addTo(gSite);
  m.bindTooltip(s.name, {direction:'top', className:'lbl', offset:[0,-6]});
  m.bindPopup('<div style="font-family:serif;max-width:220px"><b>' + s.name + '</b><br>' + s.kind + '　' + s.note + '</div>');
});

// 世界地名
var gW = L.layerGroup();
Object.keys(window.WPLACES || {}).forEach(function (k) {
  var v = window.WPLACES[k];
  L.marker([v[0], v[1]], {
    icon: L.divIcon({className:'', html:'<div class="dot wp"></div>', iconSize:[9,9]})
  }).addTo(gW).bindTooltip(k, {direction:'top', className:'lbl', offset:[0,-6]})
    .bindPopup('<div style="font-family:serif;max-width:220px"><b>' + k + '</b><br>' + v[2] + '　' + v[3] + '</div>');
});

// 世界史事
var gWE = L.layerGroup();
(window.WEVENTS || []).forEach(function (e, i) {
  var nm = e[0], yr = e[1], city = e[2], note = e[3], tag = e[4];
  if (!inEra(yr)) return;
  var c = window.WPLACES && window.WPLACES[city];
  if (!c) return;
  var m = L.marker([c[0], c[1]], {
    icon: L.divIcon({className:'', html:'<div class="dot ev" style="background:#5B4B8A"></div>', iconSize:[8,8]})
  }).addTo(gWE);
  var y = yr < 0 ? '前' + (-yr) + '年' : yr + '年';
  m.bindTooltip(nm, {direction:'top', className:'lbl', offset:[0,-6]});
  m.bindPopup('<div style="font-family:serif;max-width:220px"><b>' + nm + '</b><br>' + y + '　' + city + '<br>' + note + '</div>');
});

// 当前地名
if (place.lat != null) {
  L.marker([place.lat, place.lng], {
    icon: L.divIcon({className:'', html:'<div class="dot"></div>', iconSize:[9,9]})
  }).addTo(map).bindTooltip(place.name + (place.modern ? '（今 ' + place.modern + '）' : ''),
    {permanent:true, direction:'top', className:'lbl old', offset:[0,-6], opacity:1});
}

var gNear = L.layerGroup().addTo(map);
(place.old || []).forEach(function (p) {
  L.marker([p.lat, p.lng], {
    icon: L.divIcon({className:'', html:'<div class="dot" style="background:#7C6BA8"></div>', iconSize:[8,8]})
  }).addTo(gNear).bindTooltip(p.name + (p.modern ? '｜' + p.modern : ''),
    {permanent:true, direction:'top', className:'lbl', offset:[0,-6]});
});

function pickBase(k, btn) {
  Object.keys(base).forEach(function (x) { if (map.hasLayer(base[x])) map.removeLayer(base[x]); });
  base[k].addTo(map); base[k].bringToBack();
  ['t1','t2','t3','t4'].forEach(function (id) { document.getElementById(id).className = ''; });
  btn.className = 'on';
}
document.getElementById('t1').onclick = function () { pickBase('cn', this); };
document.getElementById('t2').onclick = function () { pickBase('terrain', this); };
document.getElementById('t3').onclick = function () { pickBase('sat', this); };
document.getElementById('t4').onclick = function () { pickBase('world', this); };
document.getElementById('t5').onclick = function () {
  location.href = 'three.html' + location.search;
};

function toggle(group, btn) {
  if (map.hasLayer(group)) { map.removeLayer(group); btn.className = 'off'; }
  else { map.addLayer(group); btn.className = 'on'; }
}
document.getElementById('o1').onclick = function () { toggle(gEvent, this); };
document.getElementById('o2').onclick = function () { toggle(gPower, this); };
document.getElementById('o3').onclick = function () { toggle(gSite, this); };
document.getElementById('o4').onclick = function () { toggle(gW, this); toggle(gWE, this); };

// 时间切片：重建史事层
function rebuild() {
  map.removeLayer(gEvent);
  gEvent = L.layerGroup();
  evLayer(window.EVENTS || [], '#B33A2B', gEvent);
  if (document.getElementById('o1').className === 'on') gEvent.addTo(map);
  map.removeLayer(gWE);
  gWE = L.layerGroup();
  (window.WEVENTS || []).forEach(function (e) {
    var nm=e[0], yr=e[1], city=e[2], note=e[3];
    if (!inEra(yr)) return;
    var c = window.WPLACES && window.WPLACES[city];
    if (!c) return;
    var m = L.marker([c[0], c[1]], {
      icon: L.divIcon({className:'', html:'<div class="dot ev" style="background:#5B4B8A"></div>', iconSize:[8,8]})
    }).addTo(gWE);
    var y = yr < 0 ? '前' + (-yr) + '年' : yr + '年';
    m.bindTooltip(nm, {direction:'top', className:'lbl', offset:[0,-6]});
    m.bindPopup('<div style="font-family:serif;max-width:220px"><b>' + nm + '</b><br>' + y + '　' + city + '<br>' + note + '</div>');
  });
}
['y1','y2','y3','y4','y5'].forEach(function (id, i) {
  document.getElementById(id).onclick = function () {
    curY = i;
    ['y1','y2','y3','y4','y5'].forEach(function (x) { document.getElementById(x).className = ''; });
    this.className = 'on';
    rebuild();
  };
});

// 对照表
document.getElementById('o5').onclick = function () {
  var p = document.getElementById('tl');
  if (p.style.display === 'block') { p.style.display = 'none'; this.className = ''; return; }
  var b = document.getElementById('tlb');
  if (!b.childNodes.length) {
    (window.TIMELINE || []).slice().sort(function (a, c) { return a[0] - c[0]; }).forEach(function (t) {
      var cy = t[0] < 0 ? '前' + (-t[0]) : t[0];
      var wy = t[2] < 0 ? '前' + (-t[2]) : t[2];
      var d = document.createElement('div'); d.className = 'it';
      d.innerHTML = '<div class="y">' + cy + ' / ' + wy + '</div>' +
        '<div class="c">' + t[1] + '</div><div class="w">' + t[3] + '</div>';
      b.appendChild(d);
    });
  }
  p.style.display = 'block'; this.className = 'on';
};
</script>
</body>
</html>
